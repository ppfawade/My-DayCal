name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g., v1.1.0)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore my-upload-key.jks

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Prepare Versioned APK Artifacts
        id: prepare_apk
        run: |
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" && "${{ github.event.inputs.release_tag }}" != "latest" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${VERSION_NAME}.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/My-DayCal-${TAG_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/My-DayCal-${TAG_NAME}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/My-DayCal-${TAG_NAME}-release.apk"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: My-DayCal-APK-${{ steps.prepare_apk.outputs.tag_name }}
          path: dist/*.apk

      - name: Check If Release Should Be Published
        id: check_release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "app/build.gradle.kts")
          if [[ "${{ github.ref }}" == refs/tags/* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "$COMMIT_MSG" =~ (\[release\]|major:|feat!:|BREAKING) ]] || \
             echo "$CHANGED_FILES" | grep -qE "^(app/|build\.gradle\.kts|settings\.gradle\.kts)"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with Downloadable APKs
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "My DayCal ${{ steps.prepare_apk.outputs.tag_name }}"
          generate_release_notes: true
          body: |
            ## My DayCal (${{ steps.prepare_apk.outputs.tag_name }})
            Minimalist daily timeline, journal & 20-year calendar for Android.

            ### Download APK
            Download and install **`My-DayCal-${{ steps.prepare_apk.outputs.tag_name }}-release.apk`** (or `-debug.apk`) below on any Android device (Android 7.0+ / API 24+).

            ### Highlights
            - **Single-Day Timeline & Journal** inspired by [Adiseny/daytile](https://github.com/Adiseny/daytile)
            - **Offline Local Storage Mode** (Room SQLite, no account required) + **Google Cloud Sync Mode** (Firestore)
            - **Past Days Archive** & **20-Year Multi-Year Calendar** (±10 years)
          files: |
            dist/*.apk
