name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (e.g., v1.4)"
        required: false
        default: "v1.4"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Gradle 9.3.1 (from gradle-wrapper.properties)
        run: |
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          rm -f /tmp/gradle.zip

      - name: Accept Android SDK Licenses & Install compileSdk 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          CMDLINE_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$CMDLINE_BIN" ]; then
            yes | "$CMDLINE_BIN" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
            "$CMDLINE_BIN" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Prepare .env, Firebase Config & Signing Keystores
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Ensure app/google-services.json exists (AI Studio strips it on GitHub push)
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              DEFAULT_GS_B64=""
              echo "$DEFAULT_GS_B64" | base64 -d > app/google-services.json
            fi
          fi

          # 3. Debug keystore (alias: androiddebugkey, SHA-1: 11:B0:35:38:20:19:2F:9F:AF:CC:0F:3F:0D:A9:54:B5:E7:0F:BC:43)
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Release keystore (alias: upload, required by app/build.gradle.kts release signingConfig)
          # Import the registered OAuth certificate from debug.keystore so both release and debug APKs
          # match the SHA-1 fingerprint registered in Firebase OAuth (11b0353820192f9fafcc0f3f0da954b5e70fbc43)
          rm -f my-upload-key.jks
          if [ -f debug.keystore ]; then
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -destkeystore my-upload-key.jks \
              -srcstorepass android \
              -deststorepass android \
              -srckeypass android \
              -destkeypass android \
              -srcalias androiddebugkey \
              -destalias upload \
              -noprompt
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=My DayCal Release,O=MyDayCal,C=US"
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          gradle :app:assembleDebug :app:assembleRelease \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Djava.awt.headless=true \
            --no-daemon \
            --stacktrace

      - name: Package Versioned APK Files
        id: prepare_apk
        run: |
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.4")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" && "${{ github.event.inputs.release_tag }}" != "latest" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/My-DayCal-${TAG_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/My-DayCal-${TAG_NAME}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/My-DayCal-${TAG_NAME}-release.apk"
          fi

          ls -lh dist/
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Downloadable APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare_apk.outputs.tag_name }}"
          NOTES_FILE="/tmp/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          ## My DayCal ($TAG)
          Minimalist tactile daily timeline planner for Android.

          ### Download APK
          Download and install **\`My-DayCal-${TAG}-release.apk\`** (or \`-debug.apk\`) below on any Android device (Android 7.0+ / API 24+).

          ### Highlights
          - **Smooth 7-Day Sequential Week Slider (\`SUN\`–\`SAT\`)**: Continuous chronological day strip with Sunday start-of-week animated \`CW\` badge and 20-year calendar date picker
          - **Dual Timeline Views (\`Timeline\` & \`24h\`)**: Focused task stream with inline \`±30m\` / \`±15m\` quick adjustments and 24-hour continuous grid with proportional multi-hour duration spanning
          - **Tactile Time-Block Editor**: Interactive 12-hour and 5-minute increment vertical looping dials, enlarged Task & Details editor, and categories \`[Focus, Work, Personal, Health, Break]\`
          - **Smart Safeguards & Reminders**: Automatic \`OVERLAP\` conflict detection badge, undoable task deletion Snackbar, and \`AlarmManager\` notification reminders
          - **Dual Themes**: **Obsidian Kinetic Dark** and **Warm Ivory Light** themes with instant top-bar toggle
          - **Dual Storage**: 100% Offline Local Storage Mode (Room SQLite) + optional Google Cloud Sync (Firebase Auth & Cloud Firestore)
          - Inspired by [Adiseny/daytile](https://github.com/Adiseny/daytile)

          ---
          > **Disclaimer (AI-Assisted Development)**: This application and its source code were developed and iterated with the assistance of AI coding tools. Provided "AS IS" without warranty; please review the source code and configurations before production use.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/*.apk \
              --title "My DayCal $TAG" \
              --notes-file "$NOTES_FILE"
          fi
